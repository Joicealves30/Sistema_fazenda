<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar novo funcionário</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='novo_funcionario.css') }}">
</head>
<body>
    <div class="container">
        <h1>Adicionar Novo Funcionário</h1>

        <form action="{{ url_for('add_funcionarios') }}" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" required><br><br>
            <label for="sexo">Sexo:</label>
            <input type="text" id="sexo" name="sexo" required><br><br>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required><br><br>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required><br><br>
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" required><br><br>
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo" required><br><br>
            <input type="submit" value="Adicionar Funcionário" class="submit-btn">
        </form>
    </div>
</body>
</html>
